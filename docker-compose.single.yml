# Один вузол для порівняння швидкості запису «1 вузол vs 3 воркери» (docs/load_testing.md, розділ 4).
# Той самий Citus 12.1 і ті самі 12 шардів, але всі на координаторі (CITUS_SINGLE_NODE=1).
# Окремий проєкт compose (name) — окремі томи, дані 3-вузлової конфігурації не зачіпаються.
#   docker compose down                                   # зупинити 3-вузлову (без -v — дані лишаються)
#   docker compose -f docker-compose.single.yml up --build
# Результати замірів пишуться в той самий ./logs/benchmarks.jsonl — у UI видно обидві топології.
name: infospace-single

services:
  citus-coordinator:
    image: citusdata/citus:12.1
    environment:
      POSTGRES_USER: space
      POSTGRES_PASSWORD: space
      POSTGRES_DB: space
    volumes:
      - citus_single:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U space -d space"]
      interval: 5s
      timeout: 3s
      retries: 30

  elasticsearch:
    image: elasticsearch:8.11.1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      citus-coordinator: { condition: service_healthy }
      elasticsearch: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://space:space@citus-coordinator:5432/space
      CITUS_COORDINATOR_HOST: citus-coordinator
      CITUS_SINGLE_NODE: "1"
      ES_URL: http://elasticsearch:9200
      REDIS_URL: redis://redis:6379/0
      SEARCH_CACHE_TTL: "300"
      TOPOLOGY_NAME: "1 вузол"
      BENCHMARK_FILE: /app/logs/benchmarks.jsonl
      GENERATOR_RATE: "100"
      GENERATOR_BUFFER: "100000"
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs

volumes:
  citus_single:
  esdata:
