services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: space
      POSTGRES_USER: space
      POSTGRES_PASSWORD: space
    volumes:
      - pgdata:/var/lib/postgresql
    
  app:
    build: .
    depends_on:
      - db
    environment:
      DB_HOST: db          
      DB_NAME: space
      DB_USER: space
      DB_PASSWORD: space
    volumes:
      - ./logs:/app/logs  

volumes:
  pgdata: